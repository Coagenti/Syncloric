services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: syncloric
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD richiesta (§ 6)}
      POSTGRES_DB: syncloric
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U syncloric -d syncloric"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: ${SYNCLORIC_IMAGE:-syncloric:local}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://syncloric:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD richiesta (§ 6)}@db:5432/syncloric
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?BETTER_AUTH_SECRET richiesta (§ 6)}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?ENCRYPTION_KEY richiesta (§ 6)}
      # Opzionale: assente/vuota => Norish disabilitato, nessun default (ADR-0007).
      NORISH_BASE_URL: ${NORISH_BASE_URL-}
      # Opzionale (§ 5.4): entrypoint rimuove il valore vuoto prima del bootstrap;
      # lo schema applicativo continua a rifiutare chiavi presenti ma vuote.
      NORISH_API_KEY: ${NORISH_API_KEY-}
      # Optional AI secrets stay environment-only; provider/enabled are admin settings.
      OPENAI_API_KEY: ${OPENAI_API_KEY-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY-}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL-}
      SYNCLORIC_AI_MODEL: ${SYNCLORIC_AI_MODEL-}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    ports:
      - "${APP_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD-SHELL", "node -e 'fetch(\"http://127.0.0.1:3000/api/health\").then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))'"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  db_data: