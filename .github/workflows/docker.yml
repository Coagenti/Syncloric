name: Docker deployment

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  docker-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Offline packaging contract and archive regression
        run: |
          python3 tests/deploy/test_packaging.py
          python3 tests/deploy/test_release_archives.py
      - name: Package committed source assets (not the checkout)
        run: python3 scripts/package-release.py --ref HEAD --output "$RUNNER_TEMP/release"
      - name: Build and smoke from the actual tarball
        run: |
          mkdir "$RUNNER_TEMP/unpacked"
          tar -xzf "$RUNNER_TEMP"/release/syncloric-*.tar.gz -C "$RUNNER_TEMP/unpacked"
          python3 "$RUNNER_TEMP"/unpacked/syncloric-*/tests/deploy/smoke.py
      - name: Retain verified source assets
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: syncloric-source-assets
          path: ${{ runner.temp }}/release/
          if-no-files-found: error

  image:
    # L'immagine è l'artefatto che i server tirano per digest: si costruisce UNA volta,
    # qui, sul commit di main, dopo che lo smoke è verde. Mai su pull_request (niente
    # push di immagini da codice non ancora mergiato).
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: docker-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Registry login (GHCR)
        run: echo "${{ github.token }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build (commit iniettato nell'immagine)
        run: |
          set -euo pipefail
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"
          SHORT="$(git rev-parse --short=9 HEAD)"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"
          echo "SHORT=$SHORT" >> "$GITHUB_ENV"
          docker build -f docker/Dockerfile \
            --build-arg SYNCLORIC_COMMIT="$GITHUB_SHA" \
            -t "$IMAGE:sha-$SHORT" -t "$IMAGE:main" .

      - name: Push e registrazione del digest
        id: push
        run: |
          set -euo pipefail
          docker push "$IMAGE:sha-$SHORT"
          docker push "$IMAGE:main"
          DIGEST="$(docker inspect --format '{{index .RepoDigests 0}}' "$IMAGE:sha-$SHORT")"
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
          {
            echo "### Immagine pubblicata"
            echo
            echo '```'
            echo "$DIGEST"
            echo '```'
            echo
            echo "Deploy: \`SYNCLORIC_IMAGE=$DIGEST\` poi \`up -d --no-deps app\` (vedi docs/DEPLOY.md)."
          } >> "$GITHUB_STEP_SUMMARY"
