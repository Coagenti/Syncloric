name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    env:
      # Variabili per il fail fast di src/server/config (§ 5.0): valori di test,
      # nessun segreto reale in CI.
      NORISH_BASE_URL: https://norish.example.invalid
      DATABASE_URL: postgres://syncloric:***@localhost:5432/syncloric_test
      BETTER_AUTH_SECRET: ci-super-secret-not-used-for-real-sessions-0123456789
      ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.34.6

      - name: Setup Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: ".nvmrc"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test:unit

      - name: Integration tests (PGlite = Postgres WASM in-process)
        run: pnpm test:integration

      - name: Install Chromium for settings browser regression
        run: pnpm exec playwright install --with-deps chromium

      - name: Build (webpack CSS for browser regression)
        run: pnpm exec next build --webpack

      - name: Browser regression (production CSS, Chromium, persistent PGlite)
        env:
          DIARY_VISUAL_CSS: "1"
        run: pnpm test:settings-browser